apiVersion: apps/v1
kind: Deployment
metadata:
  name: batch
  labels:
    app: batch
spec:
  replicas: {{ .Values.batch.replicas }}
  selector:
    matchLabels:
      app: batch
  template:
    metadata:
      labels:
        app: batch
    spec:
      containers:
        - name: batch
          image: {{ .Values.batch.image.repository }}:{{ .Values.batch.image.tag }}
          env:
            - name: MEMORY_MB
              value: {{ .Values.batch.memoryMb | quote }}
            - name: CPU_WORKERS
              value: {{ .Values.batch.cpuWorkers | quote }}
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=70.0"
          resources:
            requests:
              cpu: {{ .Values.batch.resources.requests.cpu | quote }}
              memory: {{ .Values.batch.resources.requests.memory | quote }}
            limits:
              cpu: {{ .Values.batch.resources.limits.cpu | quote }}
              memory: {{ .Values.batch.resources.limits.memory | quote }}