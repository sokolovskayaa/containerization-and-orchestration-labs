api:
  replicas: 3
  image:
    repository: registry.shop.local/api
    tag: "1.0.3"
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "250m"
      memory: "256Mi"

worker:
  replicas: 2
  image:
    repository: registry.shop.local/worker
    tag: "1.0.0"
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "250m"
      memory: "256Mi"

postgres:
  instances: 1
  image:
    repository: ghcr.io/cloudnative-pg/postgresql
    tag: "18.6-system-trixie"
  storage:
    size: "1Gi"
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "500m"
      memory: "1Gi"

batch:
  replicas: 1
  image:
    repository: registry.shop.local/batch
    tag: "0.1.0"
  memoryMb: 128
  cpuWorkers: 1
  resources:
    requests:
      cpu: "100m"
      memory: "64Mi"
    limits:
      cpu: "1000m"
      memory: "384Mi"

scheduling:
  mechanism: topologySpreadConstraints

monitoring:
  enabled: true