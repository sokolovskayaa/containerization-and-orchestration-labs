# KRR 1.28.0, 2026-10-30 23:28:47; one-hour window, 15s step.
# Window includes only five minutes of successful order load; history warning remains.
# api CPU limit is an adaptation for Guaranteed, not a KRR recommendation.
protection:
  enabled: true
api:
  replicas: 3
  resources:
    requests:
      cpu: "10m"
      memory: "100Mi"
    limits:
      cpu: "10m"
      memory: "100Mi"
worker:
  resources:
    requests:
      cpu: "10m"
      memory: "100Mi"
    limits:
      cpu: "250m"
      memory: "100Mi"
# KRR did not discover CNPG. Retain the previous resource budget explicitly.
postgres:
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "250m"
      memory: "512Mi"
batch:
  enabled: false
  replicas: 1
