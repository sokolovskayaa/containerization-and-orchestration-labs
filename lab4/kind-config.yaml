kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: shop-lab4
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          taints: []
  - role: worker
    kubeadmConfigPatches:
    - |
      kind: KubeletConfiguration
      apiVersion: kubelet.config.k8s.io/v1beta1
      evictionHard:
        memory.available: "2Gi"