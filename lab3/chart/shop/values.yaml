api:
  replicas: 3
  pdb:
    minAvailable: 1
  healthFail: "false"
  image:
    repository: registry.shop.local/api
    tag: "1.0.3"
  resources:
    requests:
      cpu: "250m"
      memory: "128Mi"
    limits:
      cpu: "250m"
      memory: "128Mi"
worker:
  replicas: 2
  image:
    repository: registry.shop.local/worker
    tag: "1.0.0"
  resources:
    requests:
      cpu: "250m"
      memory: "128Mi"
    limits:
      cpu: "250m"
      memory: "128Mi"
postgres:
  instances: 1
  image:
    repository: registry.shop.local/postgresql
    tag: "18.6-system-trixie"
  storage:
    size: "1Gi"
  pdb:
    minAvailable: 1
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "250m"
      memory: "512Mi"

# Parts 5–6 are opt-in so lab3 keeps its original scheduling behaviour.
# Resource numbers above are provisional, NOT krr recommendations.
# Replace requests AND limits for api/postgres with measured values from part 3.
protection:
  enabled: false
  criticalPriority: 100000
  batchPriority: -1000
batch:
  enabled: false
  replicas: 1
  image:
    repository: registry.shop.local/batch
    tag: "0.1.0"
  memoryMb: 128
  cpuWorkers: 1
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "1000m"
      memory: "512Mi"
