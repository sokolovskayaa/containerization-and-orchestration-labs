scheduling:
  mechanism: topologySpreadConstraints
  topologyKey: kubernetes.io/hostname
  maxSkew: 1
  whenUnsatisfiable: DoNotSchedule
  nodeTaintsPolicy: Honor
api:
  replicas: 3
  healthFail: "false"
  image:
    repository: registry.shop.local/api
    tag: "1.0.3"
  resources:
    limits:
      cpu: "250m"
      memory: "128Mi"
worker:
  replicas: 2
  image:
    repository: registry.shop.local/worker
    tag: "1.0.0"
  resources:
    limits:
      cpu: "250m"
      memory: "128Mi"
batch:
  replicas: 1
  image:
    repository: registry.shop.local/batch
    tag: "0.1.0"
  memoryMb: 128
  cpuWorkers: 1
  javaMaxHeap: "256m"
  resources:
    requests:
      cpu: "100m"
      memory: "64Mi"
    limits:
      cpu: "1000m"
      memory: "384Mi"
postgres:
  instances: 1
  image:
    repository: registry.shop.local/postgresql
    tag: "18.6-system-trixie"
  storage:
    size: "1Gi"
  resources:
    limits:
      cpu: "250m"
      memory: "512Mi"
