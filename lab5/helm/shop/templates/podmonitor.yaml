{{- if .Values.monitoring.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: shop-postgres
  labels:
    release: {{ .Values.monitoring.release }}
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: {{ .Values.postgres.name }}
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
      interval: 15s
{{- end }}