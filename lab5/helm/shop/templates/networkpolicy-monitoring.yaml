{{- if and .Values.monitoring.enabled .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: shop-api-monitoring
spec:
  podSelector:
    matchLabels:
      app: api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.monitoring.namespace }}
          podSelector:
            matchLabels:
{{ toYaml .Values.monitoring.prometheusPodLabels | indent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.monitoring.apiMetricsPort }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: shop-postgres-monitoring
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: {{ .Values.postgres.name }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.monitoring.namespace }}
          podSelector:
            matchLabels:
{{ toYaml .Values.monitoring.prometheusPodLabels | indent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.monitoring.postgresMetricsPort }}
{{- end }}